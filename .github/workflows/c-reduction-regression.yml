name: C solver reduction regression corpus
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build baseline, candidate and checker
        run: |
          git fetch --depth 1 origin 67d80b51bfbae3e2c7be6b77726d5cc346e44a51
          mkdir -p "$RUNNER_TEMP/baseline"
          git archive 67d80b51bfbae3e2c7be6b77726d5cc346e44a51 competition/c/src competition/c/include competition/c/Makefile competition/c/VERSION | tar -x -C "$RUNNER_TEMP/baseline"
          make -C "$RUNNER_TEMP/baseline/competition/c" -j2 OPTFLAGS='-O3 -flto' all
          make -C competition/c -j2 MODE=portable TARGET=bin/bsat_portable OPTFLAGS='-O3 -flto' all test
          curl -Lf https://raw.githubusercontent.com/marijnheule/drat-trim/2e3b2dc0ecf938addbd779d42877b6ed69d9a985/drat-trim.c -o "$RUNNER_TEMP/drat-trim.c"
          cc -O2 "$RUNNER_TEMP/drat-trim.c" -o "$RUNNER_TEMP/drat-trim"
          python3 competition/c/tests/build_verified_checker.py --directory "$RUNNER_TEMP/cake-lpr"
      - name: Compare fixed work and checked solves
        env:
          BSAT_DRAT_TRIM: ${{ runner.temp }}/drat-trim
          BSAT_CAKE_LPR: ${{ runner.temp }}/cake-lpr/cake_lpr
          BSAT_CAKE_HEAP_MB: '2048'
          BSAT_CAKE_STACK_MB: '512'
        run: |
          python3 competition/c/tests/prepare_linux_baseline.py "$RUNNER_TEMP/inputs" --source competition/c/tests/fixtures/reduction_regression
          mkdir -p "$RUNNER_TEMP/results"
          cp "$RUNNER_TEMP/inputs/manifest.json" "$RUNNER_TEMP/results/manifest.json"
          python3 competition/c/tests/benchmark.py --solver "baseline=$RUNNER_TEMP/baseline/competition/c/bin/bsat --binary-proof --proof {proof} {input}" --solver 'portable=competition/c/bin/bsat_portable --binary-proof --proof {proof} {input}' --checker competition/c/tests/verified_check.py --cpu-limit 30 --timeout 45 --check-timeout 600 --external-wall-only --repeats 2 --seed 2026090910 --output "$RUNNER_TEMP/results/timing.json" --retain-unverified "$RUNNER_TEMP/results/unverified" --manifest "$RUNNER_TEMP/inputs/manifest.json"
          git rev-parse HEAD > "$RUNNER_TEMP/results/revision.txt"
          cc --version > "$RUNNER_TEMP/results/compiler.txt"
          lscpu > "$RUNNER_TEMP/results/lscpu.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reduction-regression-corpus
          path: ${{ runner.temp }}/results
