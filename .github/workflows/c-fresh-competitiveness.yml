name: C solver fresh competitiveness baseline
on:
  workflow_dispatch:
    inputs:
      corpus:
        description: Frozen circuit corpus
        type: choice
        default: original
        options: [original, performance-five]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build public library and fetch pinned independent sources
        run: |
          python3 competition/c/tests/test_competitiveness_summary.py
          make -C competition/c -j2 OPTFLAGS='-O3 -flto' shared test
          curl -Lf https://github.com/arminbiere/kissat/archive/8af8e56f174b778aef3aa45af9f739b2a5f492c2.tar.gz -o "$RUNNER_TEMP/kissat.tar.gz"
          tar -xzf "$RUNNER_TEMP/kissat.tar.gz" -C "$RUNNER_TEMP"
          git init "$RUNNER_TEMP/cadical"
          git -C "$RUNNER_TEMP/cadical" remote add origin https://github.com/arminbiere/cadical.git
          git -C "$RUNNER_TEMP/cadical" fetch --depth 1 origin c60730422e758ef1cebe7aeddf2dda31c996bf04
          git -C "$RUNNER_TEMP/cadical" checkout --detach FETCH_HEAD
      - name: Build retained incremental reference
        working-directory: ${{ runner.temp }}/cadical
        run: |
          ./configure -shared
          make -j2
      - name: Build read-only reference statistics extension
        run: python3 competition/c/tests/build_reference_diagnostics.py --source "$RUNNER_TEMP/cadical" --output "$RUNNER_TEMP/cadical-diagnostics"
      - name: Build reference solver
        working-directory: ${{ runner.temp }}/kissat-8af8e56f174b778aef3aa45af9f739b2a5f492c2
        run: |
          ./configure --no-embedded -flto
          make -j2
      - name: Build independent certificate chain
        run: |
          curl -Lf https://raw.githubusercontent.com/marijnheule/drat-trim/2e3b2dc0ecf938addbd779d42877b6ed69d9a985/drat-trim.c -o "$RUNNER_TEMP/drat-trim.c"
          cc -O2 "$RUNNER_TEMP/drat-trim.c" -o "$RUNNER_TEMP/drat-trim"
          python3 competition/c/tests/build_verified_checker.py --directory "$RUNNER_TEMP/cake-lpr"
      - name: Prepare pinned circuit sets
        run: |
          git init "$RUNNER_TEMP/aiger"
          git -C "$RUNNER_TEMP/aiger" remote add origin https://github.com/arminbiere/aiger.git
          git -C "$RUNNER_TEMP/aiger" fetch --depth 1 origin 039ec1a2cc37d3093ac35c4b6df65336b346f409
          git -C "$RUNNER_TEMP/aiger" checkout --detach FETCH_HEAD
          (cd "$RUNNER_TEMP/aiger" && ./configure.sh && make -j2 aigtoaig)
          manifest=competition/c/tests/fixtures/fresh_competitiveness_aig.json
          if [ '${{ inputs.corpus }}' = performance-five ]; then
            manifest=competition/c/tests/fixtures/performance_five_aig.json
          fi
          python3 competition/c/tests/prepare_industrial_aig.py --aigtoaig "$RUNNER_TEMP/aiger/aigtoaig" --output "$RUNNER_TEMP/fresh" --manifest "$manifest"
          mkdir -p "$RUNNER_TEMP/results"
          lscpu > "$RUNNER_TEMP/results/lscpu.txt"
          cc --version > "$RUNNER_TEMP/results/compiler.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/results/revision.txt"
      - name: Serial matched-host certified histories
        env:
          BSAT_DRAT_TRIM: ${{ runner.temp }}/drat-trim
          BSAT_CAKE_LPR: ${{ runner.temp }}/cake-lpr/cake_lpr
        run: |
          python3 competition/c/tests/check_reference_statistics.py --baseline "$RUNNER_TEMP/cadical/build/libcadical.so" --diagnostic "$RUNNER_TEMP/cadical-diagnostics/build/libcadical.so" --output "$RUNNER_TEMP/results/reference-parity.json"
          python3 competition/c/tests/industrial_histories.py --library competition/c/bin/libbsat_release.so --reference "$RUNNER_TEMP/kissat-8af8e56f174b778aef3aa45af9f739b2a5f492c2/build/kissat" --incremental-reference "$RUNNER_TEMP/cadical-diagnostics/build/libcadical.so" --reference-statistics --circuits "$RUNNER_TEMP/fresh" --flags 3 --depths 0,2,4,8 --repeats 2 --cpu 10 --reference-cpu 10 --reference-wall 90 --fresh-wall 90 --checker-wall 600 --checker-heap-mb 2048 --checker-stack-mb 512 --output "$RUNNER_TEMP/results/fresh.json"
          python3 competition/c/tests/summarize_competitiveness.py "$RUNNER_TEMP/results/fresh.json" --output "$RUNNER_TEMP/results/summary.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-competitiveness
          path: ${{ runner.temp }}/results
