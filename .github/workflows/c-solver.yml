name: C solver correctness
on:
  push:
    paths: ['competition/c/**', 'competition/tests/**', '.github/workflows/c-solver.yml']
  pull_request:
    paths: ['competition/c/**', 'competition/tests/**', '.github/workflows/c-solver.yml']
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, compiler: gcc, mode: release}
          - {os: ubuntu-latest, compiler: gcc, mode: debug}
          - {os: ubuntu-latest, compiler: clang, mode: release}
          - {os: ubuntu-latest, compiler: clang, mode: debug}
          - {os: macos-latest, compiler: clang, mode: release}
          - {os: macos-latest, compiler: clang, mode: debug}
    runs-on: ${{ matrix.os }}
    # Hosted macOS ASan process startup makes the independent CLI matrix slow.
    # Preserve all cases; a failure in one platform must not cancel the others.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build independent proof checker
        run: |
          curl -Lf https://raw.githubusercontent.com/marijnheule/drat-trim/2e3b2dc0ecf938addbd779d42877b6ed69d9a985/drat-trim.c -o "$RUNNER_TEMP/drat-trim.c"
          cc -O2 "$RUNNER_TEMP/drat-trim.c" -o "$RUNNER_TEMP/drat-trim"
      - name: Build pinned verified LRAT checker
        run: python3 competition/c/tests/build_verified_checker.py --directory "$RUNNER_TEMP/cake-lpr"
      - name: Benchmark input regressions
        run: |
          python3 competition/c/tests/test_select_corpus.py
          python3 competition/c/tests/test_benchmark_manifest.py
          python3 competition/c/tests/test_profile_linux.py
          python3 competition/c/tests/test_process_control.py
      - name: Certificate retention and checker compatibility regressions
        run: DRAT_TRIM="$RUNNER_TEMP/drat-trim" python3 competition/c/tests/test_benchmark_artifacts.py
      - name: Unit and API regressions
        run: make -C competition/c all test embedding-test soak-test package-test parse-benchmark local-search-benchmark incremental-benchmark MODE=${{ matrix.mode }} CC=${{ matrix.compiler }}
      - name: Allocation failure regressions
        run: make -C competition/c fault-test MODE=${{ matrix.mode }} CC=${{ matrix.compiler }}
      - name: Parse benchmark smoke test
        run: python3 competition/c/tests/benchmark_parse.py --parser current=competition/c/bin/parse_benchmark_${{ matrix.mode }} --repeats 1 --output "$RUNNER_TEMP/parse.json" competition/tests/fixtures/unit/trivial_sat.cnf
      - name: Local-search benchmark smoke test
        run: |
          python3 competition/c/tests/benchmark.py --solver 'walk=competition/c/bin/local_search_benchmark_${{ matrix.mode }} {input} 20000 1' --repeats 1 --timeout 10 --output "$RUNNER_TEMP/walk.json" competition/c/tests/fixtures/local_search_scores/vars50/seed0.cnf
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["summary"]["walk"]["verified_runs"] == 1' "$RUNNER_TEMP/walk.json"
      - name: Repeated local-search initialization smoke test
        run: |
          python3 competition/c/tests/benchmark.py --solver 'init=competition/c/bin/local_search_benchmark_${{ matrix.mode }} {input} 0 1 3' --repeats 1 --timeout 10 --output "$RUNNER_TEMP/walk-init.json" competition/tests/fixtures/unit/trivial_sat.cnf
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["summary"]["init"]["verified_runs"] == 1; assert d["runs"][0]["stats"]["Walk runs"] == "3"' "$RUNNER_TEMP/walk-init.json"
      - name: Incremental reuse benchmark smoke test
        run: |
          python3 competition/c/tests/benchmark.py --solver 'reuse=competition/c/bin/incremental_benchmark_${{ matrix.mode }} {input} 1 20' --repeats 1 --timeout 10 --output "$RUNNER_TEMP/incremental.json" competition/tests/fixtures/unit/trivial_sat.cnf
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["summary"]["reuse"]["verified_runs"] == 1; assert d["runs"][0]["stats"]["Reused preparations"] == "20"' "$RUNNER_TEMP/incremental.json"
      - name: Independent formula and certificate validation
        shell: bash
        run: |
          binary=competition/c/bin/bsat
          if [ '${{ matrix.mode }}' = debug ]; then binary="${binary}_debug"; fi
          python3 competition/c/tests/validate.py --solver "$binary" --cases 100 --checker "$RUNNER_TEMP/drat-trim"
          python3 competition/c/tests/validate_local_search.py --solver "$binary" --checker "$RUNNER_TEMP/drat-trim"
          python3 competition/c/tests/check_deadlines.py --solver "$binary"
          python3 competition/c/tests/check_process_failures.py --solver "$binary"
          python3 competition/c/tests/check_long_search.py --solver "$binary" --checker "$RUNNER_TEMP/drat-trim" --output "$RUNNER_TEMP/long-search.json"
          BSAT_SOLVER="$binary" BSAT_DRAT_TRIM="$RUNNER_TEMP/drat-trim" BSAT_CAKE_LPR="$RUNNER_TEMP/cake-lpr/cake_lpr" python3 competition/c/tests/test_verified_check.py
          BSAT_SOLVER="$binary" BSAT_DRAT_TRIM="$RUNNER_TEMP/drat-trim" BSAT_CAKE_LPR="$RUNNER_TEMP/cake-lpr/cake_lpr" python3 competition/c/tests/test_certify_query.py
          BSAT_DRAT_TRIM="$RUNNER_TEMP/drat-trim" BSAT_CAKE_LPR="$RUNNER_TEMP/cake-lpr/cake_lpr" python3 competition/c/tests/check_factor_certificates.py --solver "$binary" --output "$RUNNER_TEMP/factor-certificates.json"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failures-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.mode }}
          path: |
            validation-failures/
            ${{ runner.temp }}/long-search.json

  thread-sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Independent instances under ThreadSanitizer
        run: make -C competition/c -j2 MODE=tsan CC=clang embedding-test soak-test
