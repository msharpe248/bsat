name: C solver complete Linux acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pinned transaction dependencies
        run: |
          make -C competition/c -j2 OPTFLAGS='-O3' all shared test
          curl -Lf https://raw.githubusercontent.com/marijnheule/drat-trim/2e3b2dc0ecf938addbd779d42877b6ed69d9a985/drat-trim.c -o "$RUNNER_TEMP/drat-trim.c"
          cc -O2 "$RUNNER_TEMP/drat-trim.c" -o "$RUNNER_TEMP/drat-trim"
          python3 competition/c/tests/build_verified_checker.py --directory "$RUNNER_TEMP/cake-lpr"
      - name: Execute isolated end-to-end acceptance
        run: |
          mkdir -p "$RUNNER_TEMP/acceptance-results"
          lscpu > "$RUNNER_TEMP/acceptance-results/lscpu.txt"
          uname -a > "$RUNNER_TEMP/acceptance-results/kernel.txt"
          sudo "$(command -v python3)" competition/c/tests/linux_acceptance.py --library competition/c/bin/libbsat_release.so --converter "$RUNNER_TEMP/drat-trim" --checker "$RUNNER_TEMP/cake-lpr/cake_lpr" --manifest competition/c/tests/fixtures/acceptance/manifest.json --query-cpu 60 --hard-query-cpu 60 --journal-mb 256 --checker-wall 60 --checker-heap-mb 2048 --checker-stack-mb 512 --wall 180 --aggregate-cpu 120 --memory-mb 4096 --storage 1073741824 --output "$RUNNER_TEMP/acceptance-results"
      - name: Make results readable
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/acceptance-results" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-linux-acceptance
          path: ${{ runner.temp }}/acceptance-results
