name: C solver certified score refresh experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build public library and fetch pinned independent sources
        run: |
          git fetch --depth 1 origin 76fcd3c569d035f22c617581b1a5627289bfeff0
          mkdir -p "$RUNNER_TEMP/baseline"
          git archive 76fcd3c569d035f22c617581b1a5627289bfeff0 competition/c/src competition/c/include competition/c/tests competition/c/Makefile competition/c/VERSION | tar -x -C "$RUNNER_TEMP/baseline"
          make -C "$RUNNER_TEMP/baseline/competition/c" -j2 OPTFLAGS='-O3 -flto' shared query-diagnostics
          git apply --check competition/c/benchmark_results/certified-refresh-prototype-20260910.patch
          git apply competition/c/benchmark_results/certified-refresh-prototype-20260910.patch
          make -C competition/c -j2 MODE=refresh OPTFLAGS='-O3 -flto -DBSAT_CERTIFIED_REFRESH' shared query-diagnostics query-certificate-driver test fault-test
          make -C competition/c -j2 MODE=refresh_debug OPTFLAGS='-g -O0 -DDEBUG -fsanitize=address -fsanitize=undefined -DBSAT_CERTIFIED_REFRESH' query-certificate-driver test fault-test
          curl -Lf https://github.com/arminbiere/kissat/archive/8af8e56f174b778aef3aa45af9f739b2a5f492c2.tar.gz -o "$RUNNER_TEMP/kissat.tar.gz"
          tar -xzf "$RUNNER_TEMP/kissat.tar.gz" -C "$RUNNER_TEMP"
          git init "$RUNNER_TEMP/cadical"
          git -C "$RUNNER_TEMP/cadical" remote add origin https://github.com/arminbiere/cadical.git
          git -C "$RUNNER_TEMP/cadical" fetch --depth 1 origin c60730422e758ef1cebe7aeddf2dda31c996bf04
          git -C "$RUNNER_TEMP/cadical" checkout --detach FETCH_HEAD
      - name: Build retained incremental reference
        working-directory: ${{ runner.temp }}/cadical
        run: |
          ./configure -shared
          make -j2
      - name: Build reference solver
        working-directory: ${{ runner.temp }}/kissat-8af8e56f174b778aef3aa45af9f739b2a5f492c2
        run: |
          ./configure --no-embedded -flto
          make -j2
      - name: Build independent certificate chain
        run: |
          curl -Lf https://raw.githubusercontent.com/marijnheule/drat-trim/2e3b2dc0ecf938addbd779d42877b6ed69d9a985/drat-trim.c -o "$RUNNER_TEMP/drat-trim.c"
          cc -O2 "$RUNNER_TEMP/drat-trim.c" -o "$RUNNER_TEMP/drat-trim"
          python3 competition/c/tests/build_verified_checker.py --directory "$RUNNER_TEMP/cake-lpr"
      - name: Prepare pinned circuit sets
        run: |
          git init "$RUNNER_TEMP/aiger"
          git -C "$RUNNER_TEMP/aiger" remote add origin https://github.com/arminbiere/aiger.git
          git -C "$RUNNER_TEMP/aiger" fetch --depth 1 origin 039ec1a2cc37d3093ac35c4b6df65336b346f409
          git -C "$RUNNER_TEMP/aiger" checkout --detach FETCH_HEAD
          (cd "$RUNNER_TEMP/aiger" && ./configure.sh && make -j2 aigtoaig)
          python3 competition/c/tests/prepare_industrial_aig.py --aigtoaig "$RUNNER_TEMP/aiger/aigtoaig" --output "$RUNNER_TEMP/original"
          python3 competition/c/tests/prepare_industrial_aig.py --aigtoaig "$RUNNER_TEMP/aiger/aigtoaig" --output "$RUNNER_TEMP/expanded" --manifest competition/c/tests/fixtures/expanded_industrial_aig.json
          python3 competition/c/tests/prepare_industrial_aig.py --aigtoaig "$RUNNER_TEMP/aiger/aigtoaig" --output "$RUNNER_TEMP/fresh" --manifest competition/c/tests/fixtures/fresh_competitiveness_aig.json
          mkdir -p "$RUNNER_TEMP/results"
          lscpu > "$RUNNER_TEMP/results/lscpu.txt"
          cc --version > "$RUNNER_TEMP/results/compiler.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/results/revision.txt"
      - name: Independently check release and sanitizer certificates
        env:
          BSAT_DRAT_TRIM: ${{ runner.temp }}/drat-trim
          BSAT_CAKE_LPR: ${{ runner.temp }}/cake-lpr/cake_lpr
        run: |
          python3 competition/c/tests/check_retained_certificates.py --driver competition/c/bin/query_certificate_driver_refresh --output "$RUNNER_TEMP/results/certificates-release.json"
          python3 competition/c/tests/check_retained_certificates.py --driver competition/c/bin/query_certificate_driver_refresh_debug --output "$RUNNER_TEMP/results/certificates-debug.json"
      - name: Serial paired target comparisons
        env:
          BSAT_DRAT_TRIM: ${{ runner.temp }}/drat-trim
          BSAT_CAKE_LPR: ${{ runner.temp }}/cake-lpr/cake_lpr
        run: |
          python3 competition/c/tests/benchmark_ssr_targets.py --experiment certified-refresh --baseline-revision 76fcd3c569d035f22c617581b1a5627289bfeff0 --baseline "$RUNNER_TEMP/baseline/competition/c/bin/libquery_diagnostics_release.so" --candidate competition/c/bin/libquery_diagnostics_refresh.so --reference "$RUNNER_TEMP/kissat-8af8e56f174b778aef3aa45af9f739b2a5f492c2/build/kissat" --incremental-reference "$RUNNER_TEMP/cadical/build/libcadical.so" --original "$RUNNER_TEMP/original" --expanded "$RUNNER_TEMP/expanded" --output "$RUNNER_TEMP/results/targets"
      - name: Fresh imported DIMACS holdout
        env:
          BSAT_DRAT_TRIM: ${{ runner.temp }}/drat-trim
          BSAT_CAKE_LPR: ${{ runner.temp }}/cake-lpr/cake_lpr
        run: |
          python3 competition/c/tests/prepare_linux_baseline.py "$RUNNER_TEMP/holdout" --source competition/c/tests/fixtures/search_use
          python3 competition/c/tests/benchmark_certified_dimacs.py --baseline "$RUNNER_TEMP/baseline/competition/c/bin/libbsat_release.so" --candidate competition/c/bin/libbsat_refresh.so --manifest "$RUNNER_TEMP/holdout/manifest.json" --output "$RUNNER_TEMP/results/holdout.json"
      - name: Isolated baseline and candidate memory measurements
        run: |
          for version in baseline candidate; do
            lib="$RUNNER_TEMP/baseline/competition/c/bin/libbsat_release.so"
            if [ "$version" = candidate ]; then lib=competition/c/bin/libbsat_refresh.so; fi
            for circuit in cal3 cal100; do
              suite=original; depths=0,1,2,4,8,16
              if [ "$circuit" = cal100 ]; then suite=expanded; depths=0,2,4; fi
              python3 competition/c/tests/measure_retained_resources.py --library "$lib" --reference "$RUNNER_TEMP/cadical/build/libcadical.so" --circuits "$RUNNER_TEMP/$suite" --checked-report "competition/c/benchmark_results/search-gap-$circuit-20260909.json" --solver bsat --circuit "$circuit.aig" --depths "$depths" --cpu 60 > "$RUNNER_TEMP/results/memory-$circuit-$version.json"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certified-refresh-experiment
          path: ${{ runner.temp }}/results
